[package]
name = "notara-mac-haptics"
links = "notara-mac-haptics"
version = "0.1.0"
edition = "2021"
publish = false
description = "macOS haptic feedback for Notara"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26.0"
objc = "0.2.7"

[dependencies]
tauri = { version = "2" }
serde = "1.0"
